# Rationale for every knob here lives in ../../../MEMORY.md.
name: service-janitor
displayName: Service Janitor

systemPromptFile: prompts/service_janitor_system.md

skills:
  - memory

schedule:
  type: scheduled
  cron: "0 5 * * *"
  firstTick: afterInterval
  taskFile: prompts/service_janitor_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - n8n credential expiry is owned by the Credentials Expiry Review workflow in agents/n8n. Stay cluster-side and do not duplicate or contradict it.
    - facts_cert_expiry returns days remaining, already computed. You need no clock and must never write a date you did not read from a tool result.

mcpServers:
  - name: datahub-local-ai-mcp-homelab-facts
    timeout: 30
    toolsPrefix: facts
    toolsAllow:
      - backup_freshness
      - cert_expiry
      - promql
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsAllow:
      - resources_list
      - pods_list
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - facts_backup_freshness
    - facts_cert_expiry
    - facts_promql
    - k8s_resources_list
    - k8s_pods_list
    - memory_search
    - memory_store
  deny:
    - write_file
    - execute_command

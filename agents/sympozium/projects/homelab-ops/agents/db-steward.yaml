name: db-steward
displayName: DB Steward

systemPromptFile: prompts/db_steward_system.md

skills:
  - k8s-ops
  - memory

schedule:
  type: scheduled
  # 05:30 UTC = 07:30 Madrid in summer. Half an hour after the warden so the
  # two do not contend for the GPU.
  cron: "30 5 * * *"
  # afterInterval, and stated rather than left to the CRD default: no cold
  # run at deploy time, just the cron tick.
  firstTick: afterInterval
  taskFile: prompts/db_steward_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - Record database and volume sizes each run. Growth rate is what predicts a full disk; a single size reading does not.
    - "Valkey is scraped by a redis exporter, so its metrics are named redis_* and never valkey_*."
    - A rising cnpg_pg_stat_archiver_failed_count means WAL archiving is broken, which silently invalidates point-in-time recovery. Treat it as the most serious finding available here.
    - Record which slow queries were already reported, so the same query is not raised from scratch every day.

# No `channels:` binding, and in hook mode that costs nothing outbound: the
# postRun container talks to the Slack API directly, so a binding would only add
# a channel sidecar and the inbound @-mention path. Every sidecar of a transport
# delivers every instance's message, so each binding used to cost one duplicate
# copy of every report in the namespace - five personas, five copies.
#
# sre-sentinel keeps the one binding in this ensemble, which is what makes an
# @-mention land on a known persona instead of whichever of five sidecars Socket
# Mode happened to hand the event to. See ../../../README.md and
# docs/core_sympozium_followup.md (Part 2, issue 5).

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-postgres
    timeout: 30
    toolsPrefix: pg
    # toolsAllow, not just toolsDeny: this filter runs at the server, so it is
    # what decides how many tool schemas are injected into the context window.
    # The full grafana catalogue is 66 tools and ~40k tokens of prompt before
    # the task is even read — the whole window as it stood until 2026-08-23, and
    # still most of it. The list mirrors this persona's toolPolicy.allow with
    # the prefix stripped, and validate.py fails if the two drift.
    toolsAllow:
      - analyze_db_health
      - get_top_queries
    # execute_sql is the one write-capable tool on this server, and postgres-mcp
    # defaults to unrestricted access mode. The analyze_* tools answer
    # everything this agent needs.
    toolsDeny:
      - execute_sql
  - name: datahub-local-core-automation-sympozium-mcp-grafana
    timeout: 30
    toolsPrefix: grafana
    # toolsAllow mirrors this persona's toolPolicy.allow with the prefix
    # stripped. It runs at the server, so it is what bounds how much of the
    # context window the tool schemas consume. validate.py fails if they drift.
    toolsAllow:
      - query_prometheus
      - list_datasources
    toolsDeny:
      - grafana_api_request
      - update_dashboard
      - update_datasource
      - create_datasource
      - create_folder
      - create_annotation
      - update_annotation
      - create_snapshot
      - delete_snapshot
      - create_incident
      - add_activity_to_incident
      - install_plugin
      - alerting_manage_rules
      - alerting_manage_routing
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    # toolsAllow mirrors this persona's toolPolicy.allow with the prefix
    # stripped. It runs at the server, so it is what bounds how much of the
    # context window the tool schemas consume. validate.py fails if they drift.
    toolsAllow:
      - resources_list
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - pg_analyze_db_health
    - pg_get_top_queries
    - grafana_query_prometheus
    # The datasourceUid is otherwise a guess, and a guess that happens to
    # be right today: this is the only way to read the real uid.
    - grafana_list_datasources
    - k8s_resources_list
    - memory_search
    - memory_store
    # No send_channel_message: every persona here delivers through
    # deliveryMode: hook, so the report is posted from a lifecycle.postRun
    # container and the model has nothing to call. Removing the tool is the
    # mechanism, not a tidy-up - it is what makes the report the model's final
    # text instead of the run ending on a tool call with an empty result.
  deny:
    - write_file
    - execute_command

table_name: price_movers
main_dttm_col: last_week
description: First vs. last observed blended price (€/kg or €/unit) per repeat product, with percentage change.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
catalog: null
sql: |-
  WITH bounds AS (
      SELECT
          description_clean,
          supermarket,
          category,
          CASE WHEN is_weighted THEN '€/kg' ELSE '€/unit' END AS price_unit,
          min_by(price, week_start) AS first_price,
          max_by(price, week_start) AS last_price,
          MIN(week_start)           AS first_week,
          MAX(week_start)           AS last_week,
          SUM(purchase_count)       AS purchases
      FROM bodega.price_trends
      GROUP BY description_clean, supermarket, category, is_weighted
  )
  SELECT
      description_clean,
      supermarket,
      category,
      price_unit,
      purchases,
      first_week,
      last_week,
      first_price,
      last_price,
      (last_price - first_price) / first_price * 100 AS change_pct
  FROM bounds
  WHERE first_week < last_week

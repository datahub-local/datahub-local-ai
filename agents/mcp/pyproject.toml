[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datahub-local-ai-mcp"
version = "0.1.0"
description = "MCP servers for datahub-local-ai agents (deterministic homelab fact gathering)"
requires-python = ">=3.13"

# Two backends only, and both are deliberate: Prometheus over plain HTTP (no
# auth on this cluster) and the Kubernetes API via the pod ServiceAccount. No
# database DSN, no ArgoCD token, no Grafana credential — ArgoCD state is read
# from `Application` custom resources and Postgres state from the CloudNativePG
# operator's metrics, so this server holds no secret at all.
dependencies = [
  "httpx>=0.27",
  "kubernetes>=30.0.0",
  "pyyaml>=6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src", "projects"]

[tool.ruff]
# Pinned to match the repository root. Ruff resolves config per file from the
# nearest pyproject, so without this `ruff check agents/mcp/` gives different
# answers depending on the directory it is invoked from.
line-length = 100

[tool.ruff.lint]
ignore = ["E402"]

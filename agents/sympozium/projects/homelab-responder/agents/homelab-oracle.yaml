# Rationale for every knob here lives in ../../../MEMORY.md.
name: homelab-oracle
displayName: Homelab Oracle

systemPromptFile: prompts/homelab_oracle_system.md

channels:
  - slack

slackOptions:
  threading: true
  threadStickiness: true
  allowedTriggers:
    - mention
    - dm

# What a question resolved to, so a follow-up starts from the object rather than
# from the words. Rationale in ../../../MEMORY.md.
memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - facts_find_object, facts_why_failed, facts_logs and facts_endpoints resolve a typed name to exact objects themselves. Never assemble a namespace, pod name, label selector or log query yourself; take every exact value from a tool result.
    - An empty tool result means searched-and-not-matched. Never upgrade it to "does not exist" - every wrong answer this agent has given was a negative claim built from a lookup that did not land.
    - Record the exact namespace and name a question resolved to, so the same question asked again starts from the object instead of the words.

# Tool names, argument names and the Prometheus datasource uid were read off the
# running servers with tools/list; a wrong name is silent. toolsAllow is what
# keeps a tool unregistered, so these selections are the boundary and the prompt
# budget both.
mcpServers:
  # 1. Pre-computed readings and the whole resolve-and-investigate chain, one
  #    call per question. Try these first.
  - name: datahub-local-ai-mcp-homelab-facts
    timeout: 30
    toolsPrefix: facts
    toolsAllow:
      - find_object
      - why_failed
      - logs
      - endpoints
      - alerts_snapshot
      - node_fleet
      - volume_fill
      - postgres_health
      - cache_health
      - cert_expiry
      - backup_freshness
      - argocd_drift
      - promql
  # 2. What exists right now, for anything the facts server does not cover.
  #    pods_list, pods_log and nodes_top are gone: find_object, logs and
  #    node_fleet answer the same questions without an exact name.
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsAllow:
      - namespaces_list
      - pods_list_in_namespace
      - events_list
      - resources_list
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale
  # 3. What is deployed. get_application_resource_tree is out with the other
  #    whole-manifest tools; the server exposes no write tool to deny.
  - name: datahub-local-core-automation-sympozium-mcp-argocd
    timeout: 30
    toolsPrefix: argocd
    toolsAllow:
      - list_applications
      - get_application
      - get_application_events
  # 4. Database contents rather than database health. No execute_sql: core's
  #    catalog denies it at the server, so allowlisting it registers nothing.
  - name: datahub-local-core-automation-sympozium-mcp-postgres
    timeout: 30
    toolsPrefix: pg
    toolsAllow:
      - list_schemas
      - list_objects
      - get_top_queries
  # 5. What the git source says, when the cluster cannot answer why. Read only:
  #    add_issue_comment is the reviewer's single write tool and stays there.
  - name: datahub-local-core-automation-sympozium-mcp-github
    timeout: 30
    toolsPrefix: github
    toolsAllow:
      - search_code
      - get_file_contents
      - list_commits
    toolsDeny:
      - add_issue_comment
      - merge_pull_request
      - create_pull_request
      - create_pull_request_review
      - create_or_update_file
      - push_files
      - create_branch
      - create_repository
      - fork_repository
      - create_issue
      - update_issue
      - update_pull_request_branch
  # 6. Slack conversation context. Read-only history and thread replies only;
  #    message posting remains the built-in delivery path.
  - name: datahub-local-core-automation-sympozium-mcp-slack
    timeout: 30
    toolsPrefix: slack
    toolsAllow:
      - slack_get_channel_history
      - slack_get_thread_replies

toolPolicy:
  allow:
    - facts_find_object
    - facts_why_failed
    - facts_logs
    - facts_endpoints
    - facts_alerts_snapshot
    - facts_node_fleet
    - facts_volume_fill
    - facts_postgres_health
    - facts_cache_health
    - facts_cert_expiry
    - facts_backup_freshness
    - facts_argocd_drift
    - facts_promql
    - k8s_namespaces_list
    - k8s_pods_list_in_namespace
    - k8s_events_list
    - k8s_resources_list
    - argocd_list_applications
    - argocd_get_application
    - argocd_get_application_events
    - pg_list_schemas
    - pg_list_objects
    - pg_get_top_queries
    - github_search_code
    - github_get_file_contents
    - github_list_commits
    - slack_slack_get_channel_history
    - slack_slack_get_thread_replies
    - send_channel_message
  deny:
    - write_file
    - execute_command

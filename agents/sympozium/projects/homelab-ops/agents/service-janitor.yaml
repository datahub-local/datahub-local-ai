name: service-janitor
displayName: Service Janitor

systemPromptFile: prompts/service_janitor_system.md

skills:
  - k8s-ops
  - memory

schedule:
  type: scheduled
  # UTC — no Sympozium CRD has a timezone field, unlike the n8n workflows.
  # 05:00 UTC is 07:00 Madrid in summer, 06:00 in winter.
  cron: "0 5 * * 1"
  # afterInterval, and stated rather than left to the CRD default: no cold
  # run at deploy time, just the cron tick.
  firstTick: afterInterval
  taskFile: prompts/service_janitor_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - Record the age of the newest successful backup per system each run. A backup system that silently stopped is the most expensive fault in the homelab.
    - Record each expiry date reported and when it was reported, so the same certificate is not raised from scratch every week.
    - Never report an expiry without a date read off the resource. A guess is worse than silence.
    - n8n credential expiry belongs to the Credentials Expiry Review workflow in agents/n8n. Out of scope here.

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    # toolsAllow bounds how many tool schemas enter the context window: it
    # runs at the server, and mirrors toolPolicy.allow with the prefix
    # stripped. validate.py fails if the two drift.
    toolsAllow:
      - resources_list
      - resources_get
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale
  - name: datahub-local-core-automation-sympozium-mcp-grafana
    timeout: 30
    toolsPrefix: grafana
    # toolsAllow mirrors this persona's toolPolicy.allow with the prefix
    # stripped. It runs at the server, so it is what bounds how much of the
    # context window the tool schemas consume. validate.py fails if they drift.
    toolsAllow:
      - query_prometheus
      - list_datasources
    toolsDeny:
      - grafana_api_request
      - update_dashboard
      - update_datasource
      - create_datasource
      - create_folder
      - create_annotation
      - update_annotation
      - create_snapshot
      - delete_snapshot
      - create_incident
      - add_activity_to_incident
      - install_plugin
      - alerting_manage_rules
      - alerting_manage_routing

toolPolicy:
  allow:
    - k8s_resources_list
    - k8s_resources_get
    - grafana_query_prometheus
    # The datasourceUid is otherwise a guess, and a guess that happens to
    # be right today: this is the only way to read the real uid.
    - grafana_list_datasources
    - memory_search
    - memory_store
  deny:
    - write_file
    - execute_command

<!doctype html>
<html lang="en" data-duration-ms="%%DURATION_MS%%" data-fps="%%FPS%%" data-frames="%%FRAMES%%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%%TITLE%%</title>
    <style>
      :root {
        --accent: %%ACCENT%%;
        --duration: %%DURATION_MS%%ms;
        --page: %%VIEWPORT%%px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: var(--page);
        background: %%BRAND_SHELL%%;
        color: %%BRAND_INK%%;
        font-family: %%FONT_TEXT%%, "Roboto", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        min-height: 100%;
        padding: 72px 64px;
        display: flex;
        flex-direction: column;
        gap: 40px;
        overflow: hidden;
      }
      h1 {
        font-size: 64px;
        line-height: 1.06;
        letter-spacing: -0.02em;
        animation-name: title-in;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-duration: var(--duration);
      }
      .rule {
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--accent), %%BRAND_HAIRLINE%%);
        transform-origin: left center;
        animation-name: grow;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-duration: var(--duration);
      }
      .blocks {
        display: flex;
        flex-direction: column;
        gap: 30px;
        margin-top: 12px;
      }
      .block {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 32px;
        padding-bottom: 20px;
        border-bottom: 2px solid %%BRAND_HAIRLINE%%;
        animation-name: %%MOTION_ANIM%%;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-duration: var(--duration);
      }
      .label {
        font-size: 34px;
        line-height: 1.2;
        color: %%BRAND_INK_MUTED%%;
      }
      .value {
        font-size: 54px;
        line-height: 1.05;
        font-weight: 700;
        text-align: right;
        color: var(--accent);
      }
      @keyframes title-in {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes grow {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(32px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes sweep {
        from {
          opacity: 0;
          transform: translateX(-48px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pulse {
        0% {
          opacity: 0;
          transform: scale(0.92);
        }
        60% {
          opacity: 1;
          transform: scale(1.03);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <h1>%%TITLE%%</h1>
    <div class="rule"></div>
    <div class="blocks">%%BLOCKS%%</div>
  </body>
</html>

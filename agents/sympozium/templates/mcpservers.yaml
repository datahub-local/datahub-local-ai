{{/*
  A Deployment, Service and MCPServer per entry in `sympozium_mcp_servers`, plus
  the ServiceAccount and ClusterRole the server reads Kubernetes through.

  Why any of it is shaped this way — the two load-bearing pod labels, the `url:`
  form, the enumerated RBAC, the required `toolsPrefix`, the absent deny list —
  is in ../MEMORY.md. Only the checks that would otherwise fail silently are
  restated here.
*/}}
{{- range $name, $server := .Values.sympozium_mcp_servers | default dict }}
{{-   if $server.enabled }}
{{-     $fullName := printf "%s-mcp-%s" $.Values.release_name $name }}
{{-     $project := $server.project | default (regexReplaceAll "-" $name "_") }}
{{-     if not $server.image }}
{{-       fail (printf "sympozium_mcp_servers.%s: image is required" $name) }}
{{-     end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
rules:
{{- /* Enumerated, never a wildcard, and read-only. The kinds `find_object`
       searches by name are here because a kind it may not list is a blind spot
       it must announce rather than a fact about the cluster: see ../MEMORY.md. */}}
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - endpoints
      - persistentvolumeclaims
      - events
    verbs: ["get", "list"]
{{- /* The one subresource, and the one read `list` cannot answer: `why_failed`
       and `logs` follow an object to the container that broke. Bounded by lines
       and by bytes at the API server; see ../../mcp/src/mcp_runner/kube.py. */}}
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
{{- /* This cluster routes with Traefik, not with `Ingress`: see ../MEMORY.md. */}}
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
{{- /* `list` and deliberately not `get`: see ../MEMORY.md. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list"]
  - apiGroups: ["velero.io"]
    resources: ["backups", "schedules"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups", "scheduledbackups", "clusters"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ $server.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcpserver
      app.kubernetes.io/instance: {{ $fullName }}
  template:
    metadata:
{{- /* Both labels are load-bearing and a third one must stay off: see
       ../MEMORY.md before touching this block. */}}
      labels:
        app.kubernetes.io/name: mcpserver
        app.kubernetes.io/instance: {{ $fullName }}
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: {{ $fullName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ printf "%s:%s" $server.image ($server.tag | default "main") | quote }}
          imagePullPolicy: {{ $server.imagePullPolicy | default "Always" }}
          args:
            - --project
            - {{ $project | quote }}
            - --port
            - "8080"
          env:
            - name: PROMETHEUS_URL
              value: {{ $server.prometheusUrl | default "http://datahub-local-core-kube-pr-prometheus.monitoring.svc:9090" | quote }}
            - name: PROMETHEUS_TIMEOUT_SECONDS
              value: {{ $server.prometheusTimeoutSeconds | default 20 | quote }}
{{- /* Loki direct, like Prometheus and for the same reason: no datasource uid on
       this path, so none can be resolved to the wrong datasource. */}}
            - name: LOKI_URL
              value: {{ $server.lokiUrl | default "http://datahub-local-core-loki.monitoring.svc:3100" | quote }}
            - name: LOKI_TIMEOUT_SECONDS
              value: {{ $server.lokiTimeoutSeconds | default 20 | quote }}
            - name: MCP_STATE_DIR
              value: /state
{{- /* Garage's admin API is the only source of per-bucket size and object
       count - Prometheus publishes no bucket label and no stored-bytes gauge -
       and the only endpoint here that needs a credential. It is optional on
       purpose: with no `garageSecret` the server holds no secret at all and the
       bucket section reports itself unavailable rather than guessing.

       Each key is named individually and never pulled in with `envFrom`. The
       Secret this points at also carries AWS_ACCESS_KEY_ID and
       AWS_SECRET_ACCESS_KEY, which are S3 *write* credentials this server has no
       use for; envFrom would hand every one of them to a read-only reporter for
       the convenience of two fewer lines. See ../MEMORY.md. */}}
{{-     if and $server.garageSecret $server.garageUrlKey }}
            - name: GARAGE_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $server.garageSecret | quote }}
                  key: {{ $server.garageUrlKey | quote }}
                  optional: true
{{-     else }}
            - name: GARAGE_ADMIN_URL
              value: {{ $server.garageAdminUrl | default "http://datahub-local-core-data-garage.data.svc:3903" | quote }}
{{-     end }}
{{-     if $server.garageSecret }}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $server.garageSecret | quote }}
                  key: {{ $server.garageTokenKey | default "adminToken" | quote }}
{{- /* `optional` is load-bearing, not caution. A secretKeyRef that cannot
       resolve leaves the pod in CreateContainerConfigError forever, which takes
       down all sixteen tools for every persona rather than the one section that
       needs the token - and the Secret this points at lives in another
       namespace by default, where a secretKeyRef cannot reach it. Optional
       degrades that to the server's own no-token path, which states itself. */}}
                  optional: true
{{-     end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
{{- /* The MCP endpoint answers on every path, so a probe must use a health
       path rather than the service root. */}}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: {{ (($server.resources).requests).cpu | default "25m" | quote }}
              memory: {{ (($server.resources).requests).memory | default "96Mi" | quote }}
            limits:
{{- /* Memory only, on purpose — see ../MEMORY.md. */}}
              memory: {{ (($server.resources).limits).memory | default "256Mi" | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    sympozium.ai/catalog: "true"
spec:
  transportType: http
{{- /* `url` and not `deployment`, so the controller reconciles no workload of
       its own. `replicas` and `timeout` are CRD defaults and are stated anyway,
       or admission-time defaulting reads as permanent drift. */}}
  url: {{ printf "http://%s.%s.svc:8080/mcp" $fullName $.Release.Namespace | quote }}
  replicas: 1
  timeout: {{ $server.timeout | default 30 }}
{{- /* Required by the CRD schema, and only a --dry-run=server apply catches it
       missing. It is why toolPolicy.allow names facts_volume_fill while
       toolsAllow names volume_fill. */}}
  toolsPrefix: {{ $server.toolsPrefix | default "facts" | quote }}
{{-   end }}
{{- end }}

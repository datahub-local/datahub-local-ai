name: Test Workflows

on:
  pull_request:
    paths:
      - ".github/workflows/test-ai.yaml"
      - "workflows/airflow/**"
      - "workflows/dbt/**"
      - "workflows/dlt/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-ai.yaml"
      - "workflows/airflow/**"
      - "workflows/dbt/**"
      - "workflows/dlt/**"

permissions:
  contents: read

concurrency:
  group: test-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airflow:
    name: Airflow tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows/airflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Run Airflow tests
        run: uv run -- pytest

  dbt:
    name: dbt tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows/dbt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The semantic gate imports registry.py from the MCP repo rather than
      # copying it, so the gate and the server apply identical rules. compile.py
      # expects it beside this checkout; MCP_REPO overrides the location.
      - name: Checkout datahub-local-ai-mcp
        uses: actions/checkout@v4
        with:
          repository: datahub-local/datahub-local-ai-mcp
          path: datahub-local-ai-mcp

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run -- pytest tests/ --ignore=tests/example_db/test_integration.py

      - name: Run integration tests (DuckDB)
        run: uv run -- pytest tests/example_db/test_integration.py -v

      # The G3 gate. Offline - `dbt parse` needs no warehouse and no credential -
      # so renaming a column the semantic registry references fails the build
      # here rather than producing a wrong number in Slack later.
      - name: semantic-compile (registry gate)
        env:
          MCP_REPO: ${{ github.workspace }}/datahub-local-ai-mcp
        run: uv run -- python semantic/compile.py --project bodega

  dlt:
    name: dlt tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows/dlt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests (DuckDB)
        run: uv run -- pytest

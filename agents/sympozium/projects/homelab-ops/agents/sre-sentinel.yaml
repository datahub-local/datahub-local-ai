# Rationale for every knob here lives in ../../../MEMORY.md.
name: sre-sentinel
displayName: SRE Sentinel

systemPromptFile: prompts/sre_sentinel_system.md

skills:
  - memory

schedule:
  type: heartbeat
  interval: 6h
  firstTick: afterInterval
  taskFile: prompts/sre_sentinel_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - The alert diff and the chronic classification are computed for you by facts_alerts_snapshot. Do not keep your own list of which alerts are chronic; the tool labels each one.
    - Record what you investigated and what you concluded, so a repeat finding can be reported as continuing rather than re-investigated from scratch.

mcpServers:
  - name: datahub-local-ai-mcp-homelab-facts
    timeout: 30
    toolsPrefix: facts
    toolsAllow:
      - alerts_snapshot
      - volume_fill
      - promql
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsAllow:
      - pods_list
      - pods_list_in_namespace
      - events_list
      - pods_log
      - resources_list
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - facts_alerts_snapshot
    - facts_volume_fill
    - facts_promql
    - k8s_pods_list
    - k8s_pods_list_in_namespace
    - k8s_events_list
    - k8s_pods_log
    - k8s_resources_list
    - memory_search
    - memory_store
  deny:
    - write_file
    - execute_command

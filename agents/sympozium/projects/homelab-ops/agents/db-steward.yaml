name: db-steward
displayName: DB Steward

systemPromptFile: prompts/db_steward_system.md

skills:
  - k8s-ops
  - memory

schedule:
  type: scheduled
  # 05:30 UTC = 07:30 Madrid in summer. Half an hour after the warden so the
  # two do not contend for the GPU.
  cron: "30 5 * * *"
  # afterInterval, and stated rather than left to the CRD default: no cold
  # run at deploy time, just the cron tick.
  firstTick: afterInterval
  taskFile: prompts/db_steward_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - Record database and volume sizes each run. Growth rate is what predicts a full disk; a single size reading does not.
    - "Valkey is scraped by a redis exporter, so its metrics are named redis_* and never valkey_*."
    - A rising cnpg_pg_stat_archiver_failed_count means WAL archiving is broken, which silently invalidates point-in-time recovery. Treat it as the most serious finding available here.
    - Record which slow queries were already reported, so the same query is not raised from scratch every day.

# Outbound: the agent posts its finished report with send_channel_message. The
# run history and the Sympozium UI are not a notification - a report nobody is
# told about is the same as no report.
#
# Binding a channel is bidirectional, so this is also an inbound path: a Slack
# message can start an AgentRun. allowedTriggers keeps that to an explicit
# @-mention, because "channel" would let any message in a channel the bot sits
# in queue a run against the one GPU. These five personas are read-only, so an
# unwanted run costs GPU time and nothing else - the write-capable
# renovate-reviewer is deliberately not bound. Narrow it further with
# channelAccessControl (allowedChats/allowedSenders) once the channel and user
# ids are known.
channels:
  - slack

slackOptions:
  allowedTriggers:
    - mention

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-postgres
    timeout: 30
    toolsPrefix: pg
    # execute_sql is the one write-capable tool on this server, and postgres-mcp
    # defaults to unrestricted access mode. The analyze_* tools answer
    # everything this agent needs.
    toolsDeny:
      - execute_sql
  - name: datahub-local-core-automation-sympozium-mcp-grafana
    timeout: 30
    toolsPrefix: grafana
    toolsDeny:
      - grafana_api_request
      - update_dashboard
      - update_datasource
      - create_datasource
      - create_folder
      - create_annotation
      - update_annotation
      - create_snapshot
      - delete_snapshot
      - create_incident
      - add_activity_to_incident
      - install_plugin
      - alerting_manage_rules
      - alerting_manage_routing
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - pg_analyze_db_health
    - pg_get_top_queries
    - grafana_query_prometheus
    - k8s_resources_list
    - memory_search
    - memory_store
    # Posting the report is part of doing the job, not an extra capability:
    # every other tool here only reads.
    - send_channel_message
  deny:
    - write_file
    - execute_command

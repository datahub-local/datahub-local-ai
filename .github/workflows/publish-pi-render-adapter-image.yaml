name: Publish Render Adapter Image

on:
  workflow_run:
    workflows: [Test Agents]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs: {}

jobs:
  changes:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      adapter: ${{ steps.filter.outputs.adapter }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # The adapter derives from the published render image, so a render change
      # must rebuild it too: the base moving is a change to this image even when
      # nothing here was edited.
      - name: Did the adapter or its base change?
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "adapter=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.workflow_run.head_sha }}^"
          files=$(git diff --name-only "$base" "${{ github.event.workflow_run.head_sha }}")
          echo "changed files:"; echo "$files"
          if echo "$files" | grep -qE '^(agents/adapters/|agents/n8n/render/)'; then
            echo "adapter=true" >> "$GITHUB_OUTPUT"
          else
            echo "adapter=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.adapter == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: `main` for the platform's AgentRuntime to point at, and the
      # commit for provenance. Both are deleted down to the retention rule by the
      # prune job below, so publishing two does not mean keeping two forever.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: agents/adapters/pi-render
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/datahub-local/datahub-local-ai-pi-render-adapter:main
            ghcr.io/datahub-local/datahub-local-ai-pi-render-adapter:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

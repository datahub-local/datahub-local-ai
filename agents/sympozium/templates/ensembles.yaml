{{/*
  Assembles one Ensemble per projects/<name>/ at render time: the team-level spec
  from ensemble.yaml, one agentConfig per agents/*.yaml, and each persona's
  prompts read straight out of prompts/*.md.

  Nothing is generated into the repository — this template *is* the build step,
  which is why the chart root is agents/sympozium/ rather than a release/
  subdirectory: Helm's .Files cannot read above the chart directory, and
  projects/ has to be inside it.

  Field-level validation lives in scripts/validate.py (skills, MCP server names
  and prefixes, tool/server coherence, orphaned prompts). Only the errors that
  would silently produce a broken manifest are re-checked here.
*/}}
{{- range $ensemblePath, $_ := .Files.Glob "projects/*/ensemble.yaml" }}
{{-   $project := dir $ensemblePath }}
{{-   $name := base $project }}
{{-   $source := $.Files.Get $ensemblePath | fromYaml }}
{{-   if not $source.spec }}
{{-     fail (printf "%s: no spec block" $ensemblePath) }}
{{-   end }}
{{-   if ne ($source.name | toString) $name }}
{{-     fail (printf "%s: name %q does not match its directory %q" $ensemblePath $source.name $name) }}
{{-   end }}
{{-   $spec := $source.spec }}
{{-   $defaults := $source.defaults | default dict }}
{{- /* Delivery knobs (channel, verbosity, notify) and the web-endpoint switch are
       chart-only: the CRD webhook decodes spec strictly, so they cannot ride
       along in sympozium_ensembles. See values/default.yaml.gotmpl. */}}
{{-   $delivery := index ($.Values.sympozium_delivery | default dict) $name | default dict }}
{{-   $web := index ($.Values.sympozium_web_endpoint | default dict) $name | default dict }}
{{-   $personaFiles := $.Files.Glob (printf "%s/agents/*.yaml" $project) }}
{{-   if not $personaFiles }}
{{-     fail (printf "%s: no personas in agents/" $project) }}
{{-   end }}
{{-   $personas := list }}
{{-   range $personaPath, $_ := $personaFiles }}
{{-     $persona := $.Files.Get $personaPath | fromYaml }}
{{-     if ne ($persona.name | toString) (base $personaPath | trimSuffix ".yaml") }}
{{-       fail (printf "%s: name %q does not match its file name" $personaPath $persona.name) }}
{{-     end }}
{{-     $promptRef := $persona.systemPromptFile }}
{{-     if not $promptRef }}
{{-       fail (printf "%s: missing systemPromptFile" $personaPath) }}
{{-     end }}
{{-     $prompt := $.Files.Get (printf "%s/%s" $project $promptRef) }}
{{-     if not $prompt }}
{{-       fail (printf "%s: systemPromptFile %q is empty or unreadable (is it excluded by .helmignore?)" $personaPath $promptRef) }}
{{-     end }}
{{- /* Substitute the delivery tokens. Deliberately a fixed token set replaced by
       name rather than `tpl`, which would execute arbitrary template code inside
       a prompt and turn any future literal {{ in prompt text into a render
       error. A token left standing fails the render, the same contract as
       DownloadTemplate's check_template_vars_present in agents/n8n. */}}
{{-     $pd := index ($delivery.personas | default dict) ($persona.name | toString) | default dict }}
{{-     $channel := $pd.channel | default $delivery.channel | default "" }}
{{-     $verbosity := lower ($pd.verbosity | default $delivery.verbosity | default "normal" | toString) }}
{{-     $notify := lower ($pd.notify | default $delivery.notify | default "always" | toString) }}
{{-     if $persona.channels }}
{{-       if not $channel }}
{{-         fail (printf "%s: bound to a channel, but sympozium_delivery.%s sets no channel for %s" $personaPath $name $persona.name) }}
{{-       end }}
{{-       $verbosityText := $.Files.Get (printf "prompts/delivery/%s.md" $verbosity) }}
{{-       if not $verbosityText }}
{{-         fail (printf "%s: verbosity %q has no prompts/delivery/%s.md" $personaPath $verbosity $verbosity) }}
{{-       end }}
{{-       $notifyText := $.Files.Get (printf "prompts/notify/%s.md" $notify) }}
{{-       if not $notifyText }}
{{-         fail (printf "%s: notify %q has no prompts/notify/%s.md" $personaPath $notify $notify) }}
{{-       end }}
{{- /* The header is not a level — every channel-bound persona gets the same one,
       so it is one shared file rather than a copy in each verbosity. */}}
{{-       $headerText := $.Files.Get "prompts/delivery/header.md" }}
{{-       if not $headerText }}
{{-         fail "prompts/delivery/header.md is missing or empty" }}
{{-       end }}
{{- /* {{ SCHEDULE }} is the cadence in words, so a reader of the message knows
       whether the next one is due in half an hour or next Monday. Read off the
       persona's own schedule rather than restated in the prompt, where it would
       drift from the cron the moment either changed. */}}
{{-       $sched := $persona.schedule | default dict }}
{{-       $cadence := "on demand" }}
{{-       if $sched.interval }}
{{-         $cadence = printf "%s, every %s" $sched.type $sched.interval }}
{{-       else if $sched.cron }}
{{-         $cadence = printf "%s, cron %s UTC" $sched.type $sched.cron }}
{{-       end }}
{{-       $block := printf "%s\n\n%s\n\n%s" (trimSuffix "\n" $headerText) (trimSuffix "\n" $verbosityText) (trimSuffix "\n" $notifyText) }}
{{-       $prompt = replace "{{ DELIVERY }}" $block $prompt }}
{{-       $prompt = replace "{{ CHANNEL }}" $channel $prompt }}
{{-       $prompt = replace "{{ AGENT }}" ($persona.displayName | toString) $prompt }}
{{-       $prompt = replace "{{ ENSEMBLE }}" $name $prompt }}
{{-       $prompt = replace "{{ SCHEDULE }}" $cadence $prompt }}
{{-     end }}
{{-     if contains "{{" $prompt }}
{{-       fail (printf "%s: %s still holds an unsubstituted token. Known tokens are {{ DELIVERY }}, {{ CHANNEL }}, {{ AGENT }}, {{ ENSEMBLE }} and {{ SCHEDULE }}, and they are only substituted on a persona bound to a channel." $personaPath $promptRef) }}
{{-     end }}
{{-     $_ := unset $persona "systemPromptFile" }}
{{-     $_ := set $persona "systemPrompt" (trimSuffix "\n" $prompt) }}
{{-     if $persona.schedule }}
{{-       $taskRef := $persona.schedule.taskFile }}
{{-       if not $taskRef }}
{{-         fail (printf "%s: schedule is set but schedule.taskFile is missing" $personaPath) }}
{{-       end }}
{{-       $task := $.Files.Get (printf "%s/%s" $project $taskRef) }}
{{-       if not $task }}
{{-         fail (printf "%s: schedule.taskFile %q is empty or unreadable" $personaPath $taskRef) }}
{{-       end }}
{{-       if contains "{{" $task }}
{{-         fail (printf "%s: %s holds a template token; task prompts take no substitution" $personaPath $taskRef) }}
{{-       end }}
{{-       $_ := unset $persona.schedule "taskFile" }}
{{-       $_ := set $persona.schedule "task" (trimSuffix "\n" $task) }}
{{-     end }}
{{- /* An HTTP endpoint is a way to exercise an agent off its schedule, which is a
       property of this cluster and not of the agent — so it is switched on from
       values, never in projects/. Adding the skill is the whole mechanism: the
       controller sees it and deploys the web-proxy beside the agent. The CRD's
       own `webEndpoint` field is deprecated in favour of exactly this. */}}
{{-     $wp := index ($web.personas | default dict) ($persona.name | toString) | default dict }}
{{-     $wpEnabled := $web.enabled | default false }}
{{-     if hasKey $wp "enabled" }}
{{-       $wpEnabled = $wp.enabled }}
{{-     end }}
{{-     if has "web-endpoint" ($persona.skills | default list) }}
{{-       fail (printf "%s: lists the web-endpoint skill. It is switched on from sympozium_web_endpoint in values, so that the testing surface is visible in one place per cluster." $personaPath) }}
{{-     end }}
{{-     if $wpEnabled }}
{{-       $_ := set $persona "skills" (append ($persona.skills | default list) "web-endpoint") }}
{{-       $rpm := $wp.requestsPerMinute | default $web.requestsPerMinute | default 60 }}
{{-       $burst := $wp.burstSize | default $web.burstSize | default 10 }}
{{-       $params := $persona.skillParams | default dict }}
{{-       $_ := set $params "web-endpoint" (dict "rate_limit_rpm" (printf "%v" $rpm) "rate_limit_burst" (printf "%v" $burst)) }}
{{-       $_ := set $persona "skillParams" $params }}
{{-     end }}
{{-     $personas = append $personas (mergeOverwrite (deepCopy $defaults) $persona) }}
{{-   end }}
{{-   $_ := set $spec "agentConfigs" $personas }}
{{- /* Per-cluster knobs (enabled, baseURL, policyRef) win over anything in source. */}}
{{-   $overrides := index ($.Values.sympozium_ensembles | default dict) $name | default dict }}
{{-   $_ := mergeOverwrite $spec $overrides }}
---
apiVersion: sympozium.ai/v1alpha1
kind: Ensemble
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
{{ toYaml $spec | indent 2 }}
{{- end }}

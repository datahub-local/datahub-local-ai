name: endpoint-warden
displayName: Endpoint Warden

systemPromptFile: prompts/endpoint_warden_system.md

skills:
  - sre-observability
  - memory

schedule:
  type: scheduled
  # 04:30 UTC = 06:30 Madrid in summer, 05:30 in winter.
  cron: "30 4 * * *"
  # afterInterval, and stated rather than left to the CRD default: no cold
  # run at deploy time, just the cron tick.
  firstTick: afterInterval
  taskFile: prompts/endpoint_warden_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - Record per-node disk usage, temperature and PSI stall rates each run. A trend is the finding; a single reading rarely is.
    - Record EDAC correctable error counts per node. A count that climbs steadily means failing RAM, even while the machine looks fine.
    - Kernel and OS versions should match across nodes. The odd one out is the finding.
    - "SMART and UPS metrics are currently missing on datahublocal-orpi-0, datahublocal-amd-2 and datahublocal-nas, and present on the other four nodes. Report that as a visibility gap every run until it is fixed — a NAS with no disk-health data is the worst place to be blind."
    - "Known kernel drift: datahublocal-orpi-0 runs 7.1.2-edge-rockchip64 while orpi-1, orpi-2 and orpi-3 run 6.1.115-vendor-rk35xx. Report it while it persists, but as one line, not a fresh discovery each run."

# Outbound: the agent posts its finished report with send_channel_message. The
# run history and the Sympozium UI are not a notification - a report nobody is
# told about is the same as no report.
#
# Binding a channel is bidirectional, so this is also an inbound path: a Slack
# message can start an AgentRun. allowedTriggers keeps that to an explicit
# @-mention, because "channel" would let any message in a channel the bot sits
# in queue a run against the one GPU. These five personas are read-only, so an
# unwanted run costs GPU time and nothing else - the write-capable
# renovate-reviewer is deliberately not bound. Narrow it further with
# channelAccessControl (allowedChats/allowedSenders) once the channel and user
# ids are known.
channels:
  - slack

slackOptions:
  allowedTriggers:
    - mention

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-grafana
    timeout: 30
    toolsPrefix: grafana
    toolsDeny:
      - grafana_api_request
      - update_dashboard
      - update_datasource
      - create_datasource
      - create_folder
      - create_annotation
      - update_annotation
      - create_snapshot
      - delete_snapshot
      - create_incident
      - add_activity_to_incident
      - install_plugin
      - alerting_manage_rules
      - alerting_manage_routing
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - grafana_query_prometheus
    - grafana_list_prometheus_metric_names
    - k8s_nodes_top
    - k8s_pods_list
    - memory_search
    - memory_store
    # Posting the report is part of doing the job, not an extra capability:
    # every other tool here only reads.
    - send_channel_message
  deny:
    - write_file
    - execute_command

{{- range $name, $server := .Values.sympozium_mcp_servers | default dict }}
{{-   if $server.enabled }}
{{-     $fullName := printf "%s-mcp-%s" $.Values.release_name $name }}
{{-     $serverArg := $server.server | default (regexReplaceAll "-" $name "_") }}
{{-     if not $server.image }}
{{-       fail (printf "sympozium_mcp_servers.%s: image is required" $name) }}
{{-     end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
{{-     if or (not (hasKey $server "kubernetesReader")) $server.kubernetesReader }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - endpoints
      - persistentvolumeclaims
      - events
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list"]
  - apiGroups: ["velero.io"]
    resources: ["backups", "schedules"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups", "scheduledbackups", "clusters"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullName }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullName }}
    namespace: {{ $.Release.Namespace }}
{{-     end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ $server.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcpserver
      app.kubernetes.io/instance: {{ $fullName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcpserver
        app.kubernetes.io/instance: {{ $fullName }}
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: {{ $fullName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ printf "%s:%s" $server.image ($server.tag | default "main") | quote }}
          imagePullPolicy: {{ $server.imagePullPolicy | default "Always" }}
          args:
            - --server
            - {{ $serverArg | quote }}
            - --port
            - "8080"
          env:
            - name: MCP_STATE_DIR
              value: /state
{{-     if $server.configMap }}
            - name: MCP_CONFIG_DIR
              value: {{ printf "/etc/mcp/%s" $serverArg | quote }}
{{-     end }}
{{-     if or (not (hasKey $server "observabilityEnv")) $server.observabilityEnv }}
            - name: PROMETHEUS_URL
              value: {{ $server.prometheusUrl | default "http://datahub-local-core-kube-pr-prometheus.monitoring.svc:9090" | quote }}
            - name: PROMETHEUS_TIMEOUT_SECONDS
              value: {{ $server.prometheusTimeoutSeconds | default 20 | quote }}
            - name: LOKI_URL
              value: {{ $server.lokiUrl | default "http://datahub-local-core-loki.monitoring.svc:3100" | quote }}
            - name: LOKI_TIMEOUT_SECONDS
              value: {{ $server.lokiTimeoutSeconds | default 20 | quote }}
{{-     end }}
{{-     if $server.configMap }}
{{-       if eq $serverArg "semantic" }}
            - name: SEMANTIC_REGISTRY_PATH
              value: /etc/mcp/semantic/registry.yaml
            - name: SEMANTIC_REGISTRY_VERSION
              value: {{ $server.semanticRegistryVersion | default ($server.tag | default "main") | quote }}
            - name: SEMANTIC_WAREHOUSE_SCOPES
              value: {{ required "semantic needs warehouseScopes (catalog.schema pairs)" $server.warehouseScopes | quote }}
{{-         if $server.cacheTTLSeconds }}
            - name: SEMANTIC_CACHE_TTL_SECONDS
              value: {{ $server.cacheTTLSeconds | quote }}
{{-         end }}
{{-       end }}
{{-     end }}
{{-     if $server.trinoUrl }}
            - name: TRINO_URL
              value: {{ $server.trinoUrl | quote }}
            - name: TRINO_USER
              value: {{ $server.trinoUser | default "mcp" | quote }}
{{-     end }}
{{-     if or (not (hasKey $server "observabilityEnv")) $server.observabilityEnv }}
{{-       if and $server.garageSecret $server.garageUrlKey }}
            - name: GARAGE_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $server.garageSecret | quote }}
                  key: {{ $server.garageUrlKey | quote }}
                  optional: true
{{-       else }}
            - name: GARAGE_ADMIN_URL
              value: {{ $server.garageAdminUrl | default "http://datahub-local-core-data-garage.data.svc:3903" | quote }}
{{-       end }}
{{-       if $server.garageSecret }}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $server.garageSecret | quote }}
                  key: {{ $server.garageTokenKey | default "adminToken" | quote }}
                  optional: true
{{-       end }}
{{-     end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: {{ (($server.resources).requests).cpu | default "25m" | quote }}
              memory: {{ (($server.resources).requests).memory | default "96Mi" | quote }}
            limits:
              memory: {{ (($server.resources).limits).memory | default "256Mi" | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
{{-     if $server.configMap }}
            - name: config
              mountPath: {{ printf "/etc/mcp/%s" $serverArg | quote }}
              readOnly: true
{{-     end }}
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{-     if $server.configMap }}
        - name: config
          configMap:
            name: {{ $server.configMap | quote }}
{{-     end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcpserver
    app.kubernetes.io/instance: {{ $fullName }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: sympozium.ai/v1alpha1
kind: MCPServer
metadata:
  name: {{ $fullName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    sympozium.ai/catalog: "true"
spec:
  transportType: http
  url: {{ printf "http://%s.%s.svc:8080/mcp" $fullName $.Release.Namespace | quote }}
  replicas: 1
  timeout: {{ $server.timeout | default 30 }}
  toolsPrefix: {{ $server.toolsPrefix | default "facts" | quote }}
{{-   end }}
{{- end }}

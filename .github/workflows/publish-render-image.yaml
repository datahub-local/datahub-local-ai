name: Publish Render Image

on:
  workflow_run:
    workflows: [Test Agents]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs: {}

jobs:
  changes:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.filter.outputs.render }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Check for render changes
        id: filter
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "^agents/n8n/render/"; then
            echo "render=true" >> $GITHUB_OUTPUT
          else
            echo "render=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.render == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: agents/n8n/render
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/datahub-local/datahub-local-ai-render:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

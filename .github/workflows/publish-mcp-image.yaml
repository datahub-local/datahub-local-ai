name: Publish MCP Image

on:
  workflow_run:
    workflows: [Test Agents]
    types: [completed]
    branches: [main]

jobs:
  changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Check for mcp changes
        id: filter
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q "^agents/mcp/"; then
            echo "mcp=true" >> $GITHUB_OUTPUT
          else
            echo "mcp=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is not optional here: agents are scheduled onto the Orange Pi
      # nodes, and an MCP server missing an arm64 image fails silently from the
      # agent's side - the tool never appears and the report comes out blander.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: agents/mcp
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/datahub-local/datahub-local-ai-mcp:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

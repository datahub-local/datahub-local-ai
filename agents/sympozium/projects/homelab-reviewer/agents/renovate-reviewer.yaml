# Rationale for every knob here lives in ../../../MEMORY.md.
name: renovate-reviewer
displayName: Renovate Reviewer

systemPromptFile: prompts/renovate_reviewer_system.md

skills:
  - code-review
  - memory

schedule:
  type: scheduled
  cron: "0 6 * * 1-5"
  firstTick: afterInterval
  taskFile: prompts/renovate_reviewer_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - Record the verdict posted per pull request, so the same verdict is not commented twice.
    - Record how past bumps of a chart turned out. A chart that broke once deserves a closer look next time.
    - Major updates are disabled in renovate.json. A PR that crosses a major is a misconfiguration, not a routine bump.

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-github
    timeout: 30
    toolsPrefix: github
    toolsAllow:
      - list_pull_requests
      - get_pull_request
      - get_pull_request_files
      - get_pull_request_status
      - get_pull_request_comments
      - get_file_contents
      - add_issue_comment
      - list_commits
    toolsDeny:
      - merge_pull_request
      - create_pull_request_review
      - create_or_update_file
      - push_files
      - create_branch
      - create_repository
      - fork_repository
      - create_pull_request
      - update_pull_request_branch
      - create_issue
      - update_issue
  - name: datahub-local-core-automation-sympozium-mcp-argocd
    timeout: 30
    toolsPrefix: argocd
    toolsAllow:
      - list_applications

toolPolicy:
  allow:
    - github_list_pull_requests
    - github_get_pull_request
    - github_get_pull_request_files
    - github_get_pull_request_status
    - github_get_pull_request_comments
    - github_get_file_contents
    - github_add_issue_comment
    - github_list_commits
    - argocd_list_applications
    - fetch_url
    - memory_search
    - memory_store
  deny:
    - write_file
    - execute_command

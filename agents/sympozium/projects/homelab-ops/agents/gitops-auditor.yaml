# Rationale for every knob here lives in ../../../MEMORY.md.
name: gitops-auditor
displayName: GitOps Auditor

systemPromptFile: prompts/gitops_auditor_system.md

skills:
  - memory

schedule:
  type: scheduled
  cron: "4 */4 * * *"
  firstTick: afterInterval
  taskFile: prompts/gitops_auditor_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - facts_argocd_drift counts consecutive runs an application has been drifting, computed from a stored snapshot. Report that count rather than keeping your own.
    - Never call for an application's resource tree. It is large enough on its own to end a run with no report at all.

mcpServers:
  - name: datahub-local-ai-mcp-homelab-facts
    timeout: 30
    toolsPrefix: facts
    toolsAllow:
      - argocd_drift
      - promql
  - name: datahub-local-core-automation-sympozium-mcp-argocd
    timeout: 30
    toolsPrefix: argocd
    toolsAllow:
      - get_application
      - get_application_events
    toolsDeny:
      - sync_application
      - delete_application
      - create_application

toolPolicy:
  allow:
    - facts_argocd_drift
    - facts_promql
    - argocd_get_application
    - argocd_get_application_events
    - memory_search
    - memory_store
  deny:
    - write_file
    - execute_command

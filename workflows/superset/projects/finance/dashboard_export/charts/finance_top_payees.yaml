slice_name: Finance - Top payees
description: Payees ranked by outflow in the selected range, with transaction counts.
  An aggregate table, so clicks never emit a stray raw-value cross-filter.
viz_type: table
params:
  datasource: 0__table
  viz_type: table
  query_mode: aggregate
  granularity_sqla: booking_date
  groupby:
  - payee
  adhoc_filters:
  - clause: WHERE
    comparator: outflow
    expressionType: SIMPLE
    operator: ==
    subject: direction
  metrics:
  - expressionType: SQL
    sqlExpression: SUM(ABS(amount))
    hasCustomLabel: true
    label: Spent
    optionName: metric_finance_payee_spend
  - expressionType: SIMPLE
    aggregate: COUNT
    column:
      column_name: payee
      type: VARCHAR
    hasCustomLabel: true
    label: Transactions
    optionName: metric_finance_payee_count
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: SUM(ABS(amount))
    hasCustomLabel: true
    label: Spent
    optionName: metric_finance_payee_sort
  order_desc: true
  row_limit: 200
  server_page_length: 15
  column_config:
    Spent:
      d3NumberFormat: ',.2f'
  table_timestamp_format: smart_date
  time_range: No filter
query_context: null
cache_timeout: null
uuid: f785bbb8-4c05-4655-9f09-d03357b032a7
version: 1.0.0

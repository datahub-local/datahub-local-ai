name: gitops-auditor
displayName: GitOps Auditor

systemPromptFile: prompts/gitops_auditor_system.md

skills:
  - k8s-ops
  - memory

schedule:
  type: sweep
  interval: 1h
  firstTick: afterInterval
  taskFile: prompts/gitops_auditor_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - Record which ArgoCD applications were drifted on each run, so persistent drift can be told from a mid-sync snapshot.
    - Drift that survives two consecutive runs is a real finding; drift seen once is usually a sync in progress.
    - OutOfSync with Healthy is still drift and must be reported.

# Outbound: the agent posts its finished report with send_channel_message. The
# run history and the Sympozium UI are not a notification - a report nobody is
# told about is the same as no report.
#
# Binding a channel is bidirectional, so this is also an inbound path: a Slack
# message can start an AgentRun. allowedTriggers keeps that to an explicit
# @-mention, because "channel" would let any message in a channel the bot sits
# in queue a run against the one GPU. These five personas are read-only, so an
# unwanted run costs GPU time and nothing else - the write-capable
# renovate-reviewer is deliberately not bound. Narrow it further with
# channelAccessControl (allowedChats/allowedSenders) once the channel and user
# ids are known.
channels:
  - slack

slackOptions:
  allowedTriggers:
    - mention

mcpServers:
  # The ArgoCD MCP server exposes no write tools at all, so no toolsDeny is
  # needed here — unlike the k8s and github servers.
  - name: datahub-local-core-automation-sympozium-mcp-argocd
    timeout: 30
    toolsPrefix: argocd

toolPolicy:
  allow:
    - argocd_list_applications
    - argocd_get_application
    - argocd_get_application_events
    - argocd_get_application_resource_tree
    - memory_search
    - memory_store
    # Posting the report is part of doing the job, not an extra capability:
    # every other tool here only reads.
    - send_channel_message
  deny:
    - write_file
    - execute_command

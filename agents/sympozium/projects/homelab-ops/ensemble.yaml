# Rationale for every knob here lives in ../../MEMORY.md.
name: homelab-ops

spec:
  description: >-
    Read-only agents covering between them what an IT crew would: on-call alert
    triage, node hardware, databases, backup continuity and ArgoCD drift.
  category: platform
  version: "1.0.0"

  workflowType: autonomous

  sharedMemory:
    enabled: true
    storageSize: 512Mi

defaults:
  provider: ollama
  model: qwen3.5:4b
  runTimeout: 30m
  env:
    MAX_TOOL_ITERATIONS: "100"

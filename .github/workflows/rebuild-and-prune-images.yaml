name: Rebuild and prune images

# Two jobs that belong together because they answer one question: are the
# published images current, and is the registry tidy.
#
# Rebuild: an image built only on a source change ages even when the source does
# not. Its base image is a moving target — node, debian, python all publish CVE
# fixes without a commit here — so a weekly rebuild is what carries those in. This
# is the same reasoning as a dependency bump, applied to the OS layer.
#
# Prune: GHCR keeps every version forever by default. The two repositories tag
# differently (see RETENTION below), so both deletion modes are needed.
#
# Staggering: one image per day, Monday to Friday, so a failure is attributable to
# one image and no two heavy multi-arch builds compete. The cron day-of-week field
# is uniform; a `*/14` day-of-month step is NOT (it matches the 1st, 15th and 29th,
# so the gap from the 29th to the next 1st is three days).
on:
  schedule:
    - cron: "17 3 * * 1" # dbt
    - cron: "17 3 * * 2" # dlt
    - cron: "17 3 * * 3" # render
    - cron: "17 3 * * 4" # pi-render-adapter
    - cron: "17 3 * * 5" # prune all
  workflow_dispatch:
    inputs:
      target:
        description: "Which image to rebuild"
        type: choice
        options: [dbt, dlt, render, pi-render-adapter, all]
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: rebuild-images
  cancel-in-progress: false

jobs:
  # The scheduled trigger carries no matrix, so the cron is mapped to a target
  # here. A dispatch names it directly.
  select:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - name: Pick the target
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "17 3 * * 1") echo "target=dbt" >> "$GITHUB_OUTPUT" ;;
            "17 3 * * 2") echo "target=dlt" >> "$GITHUB_OUTPUT" ;;
            "17 3 * * 3") echo "target=render" >> "$GITHUB_OUTPUT" ;;
            "17 3 * * 4") echo "target=pi-render-adapter" >> "$GITHUB_OUTPUT" ;;
            "17 3 * * 5") echo "target=prune" >> "$GITHUB_OUTPUT" ;;
            *)           echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT" ;;
          esac

  rebuild:
    needs: select
    if: needs.select.outputs.target != 'prune'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Resolve the matrix
        id: list
        run: |
          if [ "${{ needs.select.outputs.target }}" = "all" ]; then
            echo 'targets=["dbt","dlt","render","pi-render-adapter"]' >> "$GITHUB_OUTPUT"
          else
            echo 'targets=["${{ needs.select.outputs.target }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: rebuild
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.rebuild.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image is a case rather than a map: the context and the tag differ,
      # and the adapter additionally needs its base pulled first. Written out so a
      # reader sees all four at once instead of a level of indirection.
      - name: Rebuild ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            dbt)
              context=workflows/dbt
              image=ghcr.io/datahub-local/datahub-local-ai-dbt
              ;;
            dlt)
              context=workflows/dlt
              image=ghcr.io/datahub-local/datahub-local-ai-dlt
              ;;
            render)
              context=agents/n8n/render
              image=ghcr.io/datahub-local/datahub-local-ai-render
              ;;
            pi-render-adapter)
              context=agents/adapters/pi-render
              image=ghcr.io/datahub-local/datahub-local-ai-pi-render-adapter
              ;;
            *) echo "unknown target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          echo "building $image from $context"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "$image:main" \
            "$context"

  # RETENTION — one rule, two modes, because the two repositories tag differently.
  #
  #   ai      pushes only `:main`, so each build overwrites the tag and the older
  #           versions become untagged. `delete-only-untagged-versions` is what
  #           actually reclaims the space; the tagged `main` is never touched.
  #   ai-mcp  pushes `:main` and `:<sha>`, so it accumulates tagged versions
  #           forever. `min-versions-to-keep` bounds those.
  #
  # Both keep 5. Five is enough to roll back through a bad week of rebuilds and
  # small enough that the registry does not grow without anyone deciding it should.
  # A container tag is one version, so five versions is five tags, not five images
  # per tag.
  prune:
    needs: select
    if: always() && (needs.select.outputs.target == 'prune' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Every image published by this repository.
        package:
          - datahub-local-ai-dbt
          - datahub-local-ai-dlt
          - datahub-local-ai-render
          - datahub-local-ai-pi-render-adapter
    steps:
      - name: Prune untagged versions of ${{ matrix.package }} (keep 5)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: "true"

      - name: Prune old tagged versions of ${{ matrix.package }} (keep 5)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 5
          ignore-versions: "^main$"

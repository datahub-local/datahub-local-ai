# Rationale for every knob here lives in ../../MEMORY.md.
name: homelab-ops

spec:
  description: >-
    Read-only reporters. Each answers one question from the facts server and
    writes it up: alert triage, node hardware, databases, backup continuity and
    ArgoCD drift.
  category: platform
  version: "2.0.0"

  workflowType: autonomous

  sharedMemory:
    enabled: true
    storageSize: 512Mi

defaults:
  provider: openrouter
  model: opencode-go/deepseek-v4.1-flash
  runTimeout: 30m
  env:
    MAX_TOOL_ITERATIONS: "100"

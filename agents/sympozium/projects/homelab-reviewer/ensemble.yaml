# Rationale for every knob here lives in ../../MEMORY.md.
name: homelab-reviewer

spec:
  description: >-
    Change management for the datahub-local repositories: judges Renovate
    dependency bumps, spells out what a migration would cost, and tracks the
    health of the repositories themselves. Comments only — never merges.
  category: devops
  version: "1.0.0"

  workflowType: autonomous

  sharedMemory:
    enabled: false
    storageSize: 1Gi

defaults:
  provider: ollama
  model: qwen3.5:4b
  runTimeout: 45m
  env:
    MAX_TOOL_ITERATIONS: "100"

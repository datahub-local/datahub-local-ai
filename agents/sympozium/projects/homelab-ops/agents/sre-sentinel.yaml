name: sre-sentinel
displayName: SRE Sentinel

systemPromptFile: prompts/sre_sentinel_system.md

skills:
  - sre-observability
  - memory

schedule:
  type: heartbeat
  interval: 30m
  # afterInterval, not immediate: six agents enabled at once would queue six
  # cold runs behind each other on a single-GPU Ollama.
  firstTick: afterInterval
  taskFile: prompts/sre_sentinel_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    # The chronic set, re-verified against ALERTS on 2026-08-22. Without these
    # the agent reports the same firing series every 30 minutes forever — but a
    # seed is a list of what to *ignore when observed*, never a substitute for
    # observing, which is why each one says so.
    - "If KubeSchedulerDown or KubeControllerManagerDown fire, they are artifacts: k3s embeds both components in the server process and exposes no separate metrics endpoint. Never escalate them. Neither was firing on 2026-08-22, so this note tells you what to ignore when you see it and is not evidence that you saw it."
    - "CPUThrottlingHigh is chronic here — 10 firing series on 2026-08-22, across roughly ten workloads. Report it only if the set of affected workloads changes, and only if you read it out of ALERTS this run."
    - Watchdog fires by design. It proves the alerting pipeline is alive and is never a fault.
    - Record the firing alert set each run so the next run can report what is new, what persists and what resolved.
    - "Volume fill: only longhorn and longhorn-no-replica PersistentVolumeClaims have a per-volume capacity. All five nfs PVCs report the same shared 1.9 TB figure, so a percentage on one of those is the whole share repeated, not a volume near its limit. The expression in step 4 already excludes them; do not widen it."
    - "Correction, 2026-08-23: any earlier memory of yours reporting a volume at 96-99% and 'write operations failing' is wrong. Those runs divided available by capacity and read the free fraction as the used one, so the volumes named were the emptiest in the cluster, not the fullest. Measured that day: nothing above 31% used, and the nfs share under 1%. Distrust your own fill history before this date."
    - "NodeClockNotSynchronising is real and is not chronic: systemd-timesyncd is inactive on datahublocal-orpi-0 through orpi-3, so those kernels are never told they are synchronised. Offsets were still under a millisecond on 2026-08-23, so report it as latent rather than urgent — but do report it. It is awaiting a fix at the node."

# Outbound: the agent posts its finished report with send_channel_message. The
# run history and the Sympozium UI are not a notification - a report nobody is
# told about is the same as no report.
#
# Binding a channel is bidirectional, so this is also an inbound path: a Slack
# message can start an AgentRun. allowedTriggers keeps that to an explicit
# @-mention, because "channel" would let any message in a channel the bot sits
# in queue a run against the one GPU. These five personas are read-only, so an
# unwanted run costs GPU time and nothing else - the write-capable
# renovate-reviewer is deliberately not bound. Narrow it further with
# channelAccessControl (allowedChats/allowedSenders) once the channel and user
# ids are known.
channels:
  - slack

slackOptions:
  allowedTriggers:
    - mention

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-grafana
    timeout: 30
    toolsPrefix: grafana
    # toolsAllow, not just toolsDeny: this filter runs at the server, so it is
    # what decides how many tool schemas are injected into the context window.
    # The full grafana catalogue is 66 tools and ~40k tokens of prompt before
    # the task is even read — the whole window as it stood until 2026-08-23, and
    # still most of it. The list mirrors this persona's toolPolicy.allow with
    # the prefix stripped, and validate.py fails if the two drift.
    toolsAllow:
      - query_prometheus
      - list_datasources
    toolsDeny:
      - grafana_api_request
      - update_dashboard
      - update_datasource
      - create_datasource
      - create_folder
      - create_annotation
      - update_annotation
      - create_snapshot
      - delete_snapshot
      - create_incident
      - add_activity_to_incident
      - install_plugin
      - alerting_manage_rules
      - alerting_manage_routing
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    # toolsAllow mirrors this persona's toolPolicy.allow with the prefix
    # stripped. It runs at the server, so it is what bounds how much of the
    # context window the tool schemas consume. validate.py fails if they drift.
    toolsAllow:
      - pods_list
      - events_list
      - pods_log
      - resources_list
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - grafana_query_prometheus
    # The datasourceUid is otherwise a guess, and a guess that happens to
    # be right today: this is the only way to read the real uid.
    - grafana_list_datasources
    - k8s_pods_list
    - k8s_events_list
    - k8s_pods_log
    - k8s_resources_list
    - memory_search
    - memory_store
    # No send_channel_message: this persona is on deliveryMode: hook, so its
    # report is posted from a lifecycle.postRun container and the model has
    # nothing to call. Taking the tool away is the point, not a side effect - it
    # is what makes the report the model's final text instead of the run ending
    # on a tool call with an empty result.
  deny:
    - write_file
    - execute_command

name: sre-sentinel
displayName: SRE Sentinel

systemPromptFile: prompts/sre_sentinel_system.md

skills:
  - sre-observability
  - memory

schedule:
  type: heartbeat
  interval: 30m
  # afterInterval, not immediate: six agents enabled at once would queue six
  # cold runs behind each other on a single-GPU Ollama.
  firstTick: afterInterval
  taskFile: prompts/sre_sentinel_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    # Seeded with the chronic alerts as of 2026-08-21. Without these the agent
    # reports the same eighteen firing series every 30 minutes forever.
    - "KubeSchedulerDown and KubeControllerManagerDown fire permanently on this cluster and are artifacts: k3s embeds both components in the server process and exposes no separate metrics endpoint. Never escalate them."
    - CPUThrottlingHigh is chronic on roughly ten workloads here. Report it only if the set of affected workloads changes.
    - Watchdog fires by design. It proves the alerting pipeline is alive and is never a fault.
    - Record the firing alert set each run so the next run can report what is new, what persists and what resolved.

# Outbound: the agent posts its finished report with send_channel_message. The
# run history and the Sympozium UI are not a notification - a report nobody is
# told about is the same as no report.
#
# Binding a channel is bidirectional, so this is also an inbound path: a Slack
# message can start an AgentRun. allowedTriggers keeps that to an explicit
# @-mention, because "channel" would let any message in a channel the bot sits
# in queue a run against the one GPU. These five personas are read-only, so an
# unwanted run costs GPU time and nothing else - the write-capable
# renovate-reviewer is deliberately not bound. Narrow it further with
# channelAccessControl (allowedChats/allowedSenders) once the channel and user
# ids are known.
channels:
  - slack

slackOptions:
  allowedTriggers:
    - mention

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-grafana
    timeout: 30
    toolsPrefix: grafana
    toolsDeny:
      - grafana_api_request
      - update_dashboard
      - update_datasource
      - create_datasource
      - create_folder
      - create_annotation
      - update_annotation
      - create_snapshot
      - delete_snapshot
      - create_incident
      - add_activity_to_incident
      - install_plugin
      - alerting_manage_rules
      - alerting_manage_routing
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - grafana_query_prometheus
    - k8s_pods_list
    - k8s_events_list
    - k8s_pods_log
    - k8s_resources_list
    - memory_search
    - memory_store
    # Posting the report is part of doing the job, not an extra capability:
    # every other tool here only reads.
    - send_channel_message
  deny:
    - write_file
    - execute_command

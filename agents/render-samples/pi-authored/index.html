<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #0b0e14;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1350px;
        background: radial-gradient(1200px 700px at 50% -8%, #17213c 0%, #0b0e14 62%);
        overflow: hidden;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #eef2ff;
      }

      #kicker {
        position: absolute;
        left: 96px;
        top: 96px;
        font-size: 30px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        font-weight: 700;
        color: #97abcf;
      }

      #title-wrap { position: absolute; left: 96px; right: 96px; top: 150px; }
      .title-line {
        display: block;
        font-size: 124px;
        line-height: 1.02;
        letter-spacing: -0.03em;
        font-weight: 800;
        color: #ffffff;
      }
      #title-line-2 { color: #7c9cff; }

      #rule {
        margin-top: 42px;
        height: 6px;
        width: 0px;
        border-radius: 3px;
        background: linear-gradient(90deg, #7c9cff 0%, #4be0c0 100%);
      }

      /* ---- Role stage ---- */
      #stage { position: absolute; left: 96px; right: 96px; top: 636px; height: 438px; }
      .clip.role { position: absolute; inset: 0; }

      .card {
        position: absolute;
        inset: 0;
        border-radius: 34px;
        background: linear-gradient(160deg, rgba(30,39,63,0.96) 0%, rgba(15,20,33,0.96) 100%);
        border: 2px solid rgba(124,156,255,0.34);
        padding: 56px 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
      }

      /* ---- CSS-drawn icons (inline tags only) ---- */
      .icon { width: 104px; height: 104px; flex: 0 0 104px; display: grid; }

      .icon-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
      .icon-grid b { border: 6px solid #4be0c0; border-radius: 7px; display: block; }
      .icon-grid b.on { background: #4be0c0; }

      .icon-bars { grid-template-rows: 1fr 1fr 1fr; gap: 10px; align-content: center; }
      .icon-bars b { display: block; height: 20px; border-radius: 6px; background: #7c9cff; }
      .icon-bars b:nth-child(2) { width: 100%; opacity: 0.72; }
      .icon-bars b:nth-child(3) { width: 60%; opacity: 0.44; }

      .icon-check { position: relative; }
      .icon-check i {
        position: absolute; inset: 0;
        border: 6px solid #ffb457; border-radius: 50%;
      }
      .icon-check b {
        position: absolute; left: 30px; top: 22px; width: 14px; height: 48px;
        background: #ffb457; border-radius: 4px; transform: rotate(45deg);
      }
      .icon-check b + b {
        left: 52px; top: 30px; height: 26px; transform: rotate(-45deg);
      }
      .card { display: block; }
      .role-head { display: flex; align-items: center; gap: 28px; }
      .role-desc { display: block; }
      .icon { width: 104px; height: 104px; flex: 0 0 104px; }
      .role-name { font-size: 74px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff; }
      .card, .card * { box-sizing: border-box; }
      .role-idx { margin-left: auto; font-size: 30px; font-weight: 700; letter-spacing: 0.2em; color: #8697bc; }
      .role-desc { font-size: 38px; line-height: 1.3; font-weight: 500; color: #c3cfe9; max-width: 760px; }

      /* ---- Progress pips ---- */
      #pips { position: absolute; left: 96px; right: 96px; top: 1150px; display: flex; gap: 18px; }
      .pip { height: 10px; flex: 1 1 0; border-radius: 5px; background: rgba(124,156,255,0.2); overflow: hidden; }
      .pip-fill { display: block; height: 100%; width: 0%; border-radius: 5px; background: #4be0c0; }

      #footer {
        position: absolute;
        left: 96px;
        right: 96px;
        top: 1212px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 27px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 600;
        color: #8496bb;
      }
      #pulse {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #4be0c0;
        margin-right: 14px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="titles"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1350"
    >
      <div id="kicker">Autonomous systems</div>

      <div id="title-wrap">
        <span id="title-line-1" class="title-line">AI agents,</span>
        <span id="title-line-2" class="title-line">at work</span>
        <div id="rule"></div>
      </div>

      <div id="stage">
        <!-- Planner -->
        <section class="clip role" id="role-planner" data-start="1.55" data-duration="1.5" data-track-index="0">
          <span class="card">
            <span class="role-head">
              <span class="icon icon-grid">
                <b></b><b></b><b></b><b class="on"></b>
              </span>
              <span class="role-name">Planner</span>
              <span class="role-idx">01</span>
            </span>
            <span class="role-desc">Breaks the goal into ordered, testable steps.</span>
          </span>
        </section>

        <!-- Builder -->
        <section class="clip role" id="role-builder" data-start="3.05" data-duration="1.5" data-track-index="0">
          <span class="card">
            <span class="role-head">
              <span class="icon icon-bars">
                <b></b><b></b><b></b>
              </span>
              <span class="role-name">Builder</span>
              <span class="role-idx">02</span>
            </span>
            <span class="role-desc">Writes the code, wires the tools, ships the change.</span>
          </span>
        </section>

        <!-- Reviewer -->
        <section class="clip role" id="role-reviewer" data-start="4.55" data-duration="1.45" data-track-index="0">
          <span class="card">
            <span class="role-head">
              <span class="icon icon-check">
                <i></i><b></b><b></b>
              </span>
              <span class="role-name">Reviewer</span>
              <span class="role-idx">03</span>
            </span>
            <span class="role-desc">Checks the work, catches regressions, signs off.</span>
          </span>
        </section>
      </div>

      <div id="pips">
        <div class="pip"><span class="pip-fill" id="pip-1"></span></div>
        <div class="pip"><span class="pip-fill" id="pip-2"></span></div>
        <div class="pip"><span class="pip-fill" id="pip-3"></span></div>
      </div>

      <div id="footer">
        <span><span id="pulse"></span>Live loop</span>
        <span>Plan &middot; Build &middot; Review</span>
      </div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });

        // ---- Title reveal (0 -> 1.45) ----
        tl.fromTo("#kicker",
          { opacity: 0, x: -28 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0);

        tl.fromTo("#title-line-1",
          { opacity: 0, y: 74 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.12);

        tl.fromTo("#title-line-2",
          { opacity: 0, y: 74 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.28);

        tl.fromTo("#rule",
          { width: 0 },
          { width: 520, duration: 0.55, ease: "power2.inOut" }, 0.5);

        // ---- Planner (1.55 -> 3.05) ----
        tl.fromTo("#role-planner .card",
          { opacity: 0, y: 46 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.6);
        tl.fromTo("#pip-1",
          { width: "0%" },
          { width: "100%", duration: 1.05, ease: "none" }, 1.9);

        // ---- Builder (3.05 -> 4.55) ----
        tl.fromTo("#role-builder .card",
          { opacity: 0, y: 46 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.1);
        tl.fromTo("#pip-2",
          { width: "0%" },
          { width: "100%", duration: 1.05, ease: "none" }, 3.4);

        // ---- Reviewer (4.55 -> 6.0) ----
        tl.fromTo("#role-reviewer .card",
          { opacity: 0, y: 46 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.6);
        tl.fromTo("#pip-3",
          { width: "0%" },
          { width: "100%", duration: 1.05, ease: "none" }, 4.9);

        // ---- Continuous liveness: pulse dot breathes across the whole piece ----
        tl.fromTo("#pulse",
          { opacity: 0.3 },
          { opacity: 1, duration: 0.72, ease: "sine.inOut", repeat: 8, yoyo: true }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines["titles"] = tl;
      })();
    </script>
  </body>
</html>

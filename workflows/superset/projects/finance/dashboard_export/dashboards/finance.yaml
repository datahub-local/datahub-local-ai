metadata:
  color_scheme: supersetColors
  refresh_frequency: 0
  expanded_slices: {}
  label_colors: {}
  timed_refresh_immune_slices: []
  cross_filters_enabled: true
  # Only correct cross-filter emitters are on this dashboard: vertical stacked bars
  # with a dimension, a line with dimensions, and an aggregate table. The charts that
  # emit the wrong filter in Superset 6.1.0 are horizontal echarts bars (transposed
  # series) and raw-mode tables (every cell emits its own value); neither is used, so
  # no chart_configuration exclusions are needed.
  chart_configuration: {}
  native_filter_configuration:
  - id: NATIVE_FILTER-finance-time
    name: Date range
    filterType: filter_time
    targets:
    - {}
    defaultDataMask:
      extraFormData:
        time_range: Last year
      filterState:
        value: Last year
    controlValues: {}
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    type: NATIVE_FILTER
    description: ''
  - id: NATIVE_FILTER-finance-bank
    name: Bank
    filterType: filter_select
    targets:
    - column:
        name: institution_id
      datasetUuid: f4619989-2d35-4859-b589-574f215c5a0c
    - column:
        name: institution_id
      datasetUuid: bffd5a77-a4ef-4217-a108-fe3c83e23b78
    defaultDataMask:
      extraFormData: {}
      filterState: {}
    controlValues:
      multiSelect: true
      enableEmptyFilter: false
      defaultToFirstItem: false
      searchAllOptions: false
      inverseSelection: false
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    type: NATIVE_FILTER
    description: Filters the charts that carry a bank column; the balance series reads
      its own institution from a different dataset and is left unfiltered rather than
      narrowed.
  - id: NATIVE_FILTER-finance-category
    name: Category
    filterType: filter_select
    targets:
    - column:
        name: category
      datasetUuid: f4619989-2d35-4859-b589-574f215c5a0c
    - column:
        name: category
      datasetUuid: bffd5a77-a4ef-4217-a108-fe3c83e23b78
    defaultDataMask:
      extraFormData: {}
      filterState: {}
    controlValues:
      multiSelect: true
      enableEmptyFilter: false
      defaultToFirstItem: false
      searchAllOptions: true
      inverseSelection: false
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    type: NATIVE_FILTER
    description: ''

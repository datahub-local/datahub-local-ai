# Rationale for every knob here lives in ../../../MEMORY.md.
name: db-steward
displayName: DB Steward

systemPromptFile: prompts/db_steward_system.md

skills:
  - memory

schedule:
  type: scheduled
  cron: "30 5 * * *"
  firstTick: afterInterval
  taskFile: prompts/db_steward_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - The archiver figure from facts_postgres_health is an increase over a window and already carries its verdict. A non-zero lifetime total with a zero increase is healthy; the tool will not show you the lifetime total.
    - This Valkey has no memory ceiling configured, so there is no percentage to report. Suggesting maxmemory is worth saying once, not every run.

mcpServers:
  - name: datahub-local-ai-mcp-homelab-facts
    timeout: 30
    toolsPrefix: facts
    toolsAllow:
      - postgres_health
      - cache_health
      - volume_fill
      - promql
  - name: datahub-local-core-automation-sympozium-mcp-postgres
    timeout: 30
    toolsPrefix: pg
    toolsAllow:
      - analyze_db_health
      - get_top_queries
    toolsDeny:
      - execute_write_query

toolPolicy:
  allow:
    - facts_postgres_health
    - facts_cache_health
    - facts_volume_fill
    - facts_promql
    - pg_analyze_db_health
    - pg_get_top_queries
    - memory_search
    - memory_store
  deny:
    - write_file
    - execute_command

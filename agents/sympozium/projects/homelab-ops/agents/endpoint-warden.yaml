# Rationale for every knob here lives in ../../../MEMORY.md.
name: endpoint-warden
displayName: Endpoint Warden

systemPromptFile: prompts/endpoint_warden_system.md

skills:
  - memory

schedule:
  type: scheduled
  cron: "30 4 * * *"
  firstTick: afterInterval
  taskFile: prompts/endpoint_warden_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - facts_node_fleet computes hardware classes from the running kernels and compares versions only inside a class. Never compare a kernel across classes; different classes are different silicon and can never converge.
    - Record which machines you have flagged, so a machine that stays flagged reads as continuing rather than new.

mcpServers:
  - name: datahub-local-ai-mcp-homelab-facts
    timeout: 30
    toolsPrefix: facts
    toolsAllow:
      - node_fleet
      - promql
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsAllow:
      - pods_list
      - nodes_top
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale

toolPolicy:
  allow:
    - facts_node_fleet
    - facts_promql
    - k8s_pods_list
    - k8s_nodes_top
    - memory_search
    - memory_store
  deny:
    - write_file
    - execute_command

name: Test Agents

on:
  pull_request:
    paths:
      - ".github/workflows/test-agents.yaml"
      - "agents/sympozium/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-agents.yaml"
      - "agents/sympozium/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: test-agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sympozium:
    name: Sympozium ensembles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra sympozium --extra dev

      - name: Lint validator
        run: uv run -- ruff check agents/sympozium/scripts/

      # Field-level checks the Helm templates cannot do: skills, MCP server
      # names and prefixes, tool/server coherence, schedule enums, orphaned
      # prompts. Each of these fails silently at runtime if wrong.
      - name: Validate ensemble sources
        run: uv run python agents/sympozium/scripts/validate.py

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up helmfile
        uses: helmfile/helmfile-action@v2
        with:
          helmfile-args: version

      # The templates assemble the Ensembles from projects/ at render time —
      # nothing is generated into the repository — so rendering is the build,
      # and a render failure here is a broken deploy.
      #
      # Via helmfile, not `helm template`, because that is the path ArgoCD takes:
      # its CMP runs argo-cd-helmfile.sh. The difference is not cosmetic —
      # helmfile renders values/default.yaml.gotmpl as a Go template *before*
      # Helm parses it as YAML, comments included, so a literal brace pair
      # anywhere in that file is an undefined-function error that `helm template`
      # never sees. That is exactly how a comment broke the ArgoCD sync on
      # 2026-08-23 after CI had passed.
      - name: Render ensembles
        working-directory: agents/sympozium
        run: helmfile template

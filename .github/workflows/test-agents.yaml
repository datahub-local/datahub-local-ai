name: Test Agents

on:
  pull_request:
    paths:
      - ".github/workflows/test-agents.yaml"
      - "agents/n8n/**"
      - "agents/sympozium/**"
      - "agents/adapters/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-agents.yaml"
      - "agents/n8n/**"
      - "agents/sympozium/**"
      - "agents/adapters/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: test-agents-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n8n:
    name: n8n exports and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra dev

      # Offline: these read the committed workflow exports, so no cluster, no
      # credential and no network. Nothing else ran agents/n8n/ -- the export
      # guards existed but no job invoked them, so a broken export shipped.
      - name: Test n8n exports and scripts
        run: uv run -- pytest agents/n8n/scripts/ -q

  render:
    name: render service composition tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Offline composition tests only: they build the markup and assert its
      # structure, so they need no Chrome, no FFmpeg and no cluster. No npm
      # install is required - the tests import only node builtins and local files;
      # the render itself is exercised by the container smoke test (see tasks 3.2).
      #
      # The glob is quoted so Node expands it, not the shell: on Node 22 a bare
      # directory is resolved as a module and fails with MODULE_NOT_FOUND, which
      # Node 26 does not do. Explicit patterns work on both.
      - name: Test composition builder
        run: node --test 'agents/n8n/render/test/*.test.mjs'

  pi-render-adapter:
    name: pi-render adapter session helpers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Offline: the session server's path validation and output-format helpers
      # import only node builtins, so no image, no ffmpeg and no cluster are needed.
      - name: Test session helpers
        run: node --test 'agents/adapters/pi-render/test/*.test.mjs'

  render-changes:
    name: render changes
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Building the image (Chromium + FFmpeg) only proves something when the
      # render source changed, and most Test Agents runs are n8n workflow
      # backups. Diffing here keeps the smoke job from rebuilding for a JSON-only
      # change; the same raw-git-diff filter the publish workflow uses.
      - name: Did agents/n8n/render change?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "$BASE_REF" 2>/dev/null || true
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="HEAD^"
          fi
          files=$(git diff --name-only "$base"...HEAD || git diff --name-only HEAD^ HEAD)
          echo "changed files:"
          echo "$files"
          if echo "$files" | grep -q '^agents/n8n/render/'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  render-image:
    name: render service image smoke test
    needs: render-changes
    if: needs.render-changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t datahub-local-ai-render:ci agents/n8n/render

      # Same security context the core deployment runs with (read-only root,
      # all capabilities dropped, /tmp an emptyDir) so a read-only-filesystem
      # regression fails here rather than only in the cluster: the first
      # deployed image 502'd because Chrome could not write its user data
      # directory under a read-only /home/node. --shm-size stands in for the
      # dshm emptyDir.
      - name: Start the container
        run: |
          docker run -d --name render \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --shm-size=1g --tmpfs /tmp \
            -p 18080:8080 datahub-local-ai-render:ci
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:18080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "service did not become healthy" >&2
          docker logs render >&2
          exit 1

      - name: Smoke test the rendered MP4
        run: RENDER_URL=http://127.0.0.1:18080 RENDER_CONTAINER=render node agents/n8n/render/test/smoke.mjs

      - name: Container logs
        if: always()
        run: docker logs render

  sympozium:
    name: Sympozium ensembles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python with uv
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint delivery hook
        run: uv run -- ruff check agents/sympozium/files/ agents/sympozium/tests/

      # The delivery hook is the only code in this sub-project that runs in
      # production; every report passes through its Markdown conversion.
      - name: Test delivery hook
        run: uv run -- pytest agents/sympozium/tests/ -q

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Installed from the release tarball rather than a third-party action, and
      # unpinned like azure/setup-helm above: renovate.json ignores **/.github/**,
      # so a pinned version here would go stale without anything noticing.
      - name: Set up helmfile
        run: |
          version=$(curl -fsSL https://api.github.com/repos/helmfile/helmfile/releases/latest \
            | jq -r .tag_name | sed 's/^v//')
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${version}/helmfile_${version}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin helmfile
          helmfile version

      # The templates assemble the Ensembles from projects/ at render time —
      # nothing is generated into the repository — so rendering is the build,
      # and a render failure here is a broken deploy.
      #
      # Via helmfile, not `helm template`, because that is the path ArgoCD takes:
      # its CMP runs argo-cd-helmfile.sh. The difference is not cosmetic —
      # helmfile renders values/default.yaml.gotmpl as a Go template *before*
      # Helm parses it as YAML, comments included, so a literal brace pair
      # anywhere in that file is an undefined-function error that `helm template`
      # never sees. That is exactly how a comment broke the ArgoCD sync on
      # 2026-08-23 after CI had passed.
      - name: Render ensembles
        working-directory: agents/sympozium
        run: helmfile template

name: service-janitor
displayName: Service Janitor

systemPromptFile: prompts/service_janitor_system.md

skills:
  - k8s-ops
  - memory

schedule:
  type: scheduled
  # UTC — no Sympozium CRD has a timezone field, unlike the n8n workflows.
  # 05:00 UTC is 07:00 Madrid in summer, 06:00 in winter.
  cron: "0 5 * * 1"
  # afterInterval, and stated rather than left to the CRD default: no cold
  # run at deploy time, just the cron tick.
  firstTick: afterInterval
  taskFile: prompts/service_janitor_task.md

memory:
  enabled: true
  maxSizeKB: 256
  seeds:
    - Record the age of the newest successful backup per system each run. A backup system that silently stopped is the most expensive fault in the homelab.
    - Record each expiry date reported and when it was reported, so the same certificate is not raised from scratch every week.
    - Never report an expiry without a date read off the resource. A guess is worse than silence.
    - n8n credential expiry belongs to the Credentials Expiry Review workflow in agents/n8n. Out of scope here.

# Outbound: the agent posts its finished report with send_channel_message. The
# run history and the Sympozium UI are not a notification - a report nobody is
# told about is the same as no report.
#
# Binding a channel is bidirectional, so this is also an inbound path: a Slack
# message can start an AgentRun. allowedTriggers keeps that to an explicit
# @-mention, because "channel" would let any message in a channel the bot sits
# in queue a run against the one GPU. These five personas are read-only, so an
# unwanted run costs GPU time and nothing else - the write-capable
# renovate-reviewer is deliberately not bound. Narrow it further with
# channelAccessControl (allowedChats/allowedSenders) once the channel and user
# ids are known.
channels:
  - slack

slackOptions:
  allowedTriggers:
    - mention

mcpServers:
  - name: datahub-local-core-automation-sympozium-mcp-k8s
    timeout: 30
    toolsPrefix: k8s
    toolsDeny:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale
  - name: datahub-local-core-automation-sympozium-mcp-grafana
    timeout: 30
    toolsPrefix: grafana
    toolsDeny:
      - grafana_api_request
      - update_dashboard
      - update_datasource
      - create_datasource
      - create_folder
      - create_annotation
      - update_annotation
      - create_snapshot
      - delete_snapshot
      - create_incident
      - add_activity_to_incident
      - install_plugin
      - alerting_manage_rules
      - alerting_manage_routing

toolPolicy:
  allow:
    - k8s_resources_list
    - k8s_resources_get
    - grafana_query_prometheus
    - memory_search
    - memory_store
    # Posting the report is part of doing the job, not an extra capability:
    # every other tool here only reads.
    - send_channel_message
  deny:
    - write_file
    - execute_command
